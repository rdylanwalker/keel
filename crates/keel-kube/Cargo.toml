[package]
name = "keel-kube"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test doubles (`InMemoryPreviewCluster`, `InMemorySecretStore` inspection helpers) for other
# crates' tests. Enable only from `[dev-dependencies]`, never in shipped binaries.
test-support = []

[dependencies]
keel-core.workspace = true
keel-pko.workspace = true

aes-gcm.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
noyalib.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# CEL interpreter: evaluates the generated Kyverno `ValidatingPolicy` expressions in unit tests.
cel = { version = "0.16", default-features = false, features = ["regex"] }
tower = { version = "0.5", features = ["util"] }
