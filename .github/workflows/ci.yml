name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

env:
  # renovate: datasource=crate depName=mdbook
  MDBOOK_VERSION: 0.5.4
  # renovate: datasource=crate depName=mdbook-mermaid
  MDBOOK_MERMAID_VERSION: 0.17.1

jobs:
  rust-quality:
    name: Rust Quality Gates
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov
      - uses: ./.github/actions/setup-sops-age
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit Tests & Coverage Check (>= 80% lines)
        env:
          # Fail (instead of skip) the real SOPS + age round-trip test if the binaries are missing.
          KEEL_REQUIRE_SOPS: "1"
        run: cargo llvm-cov --workspace --fail-under-lines 80

  ui-quality:
    name: UI Quality Gates
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Format Check
        run: pnpm --dir ui format:check
      - name: Lint
        run: pnpm --dir ui lint
      - name: Typecheck
        run: pnpm --dir ui typecheck
      - name: Unit Tests & Coverage (>= 80% lines, enforced by vite.config.ts thresholds)
        run: pnpm --dir ui test:unit --coverage

  e2e-quality:
    name: E2E Quality Gates
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: e2e/pnpm-lock.yaml
      - uses: ./.github/actions/setup-sops-age
      - name: Build UI & Keel Binary
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
          cargo build --bin keel
      - name: Install E2E dependencies
        run: pnpm --dir e2e install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm --dir e2e exec playwright install --with-deps
      - name: Format Check
        run: pnpm --dir e2e format:check
      - name: Lint
        run: pnpm --dir e2e lint
      - name: Typecheck
        run: pnpm --dir e2e typecheck
      - name: Test
        run: pnpm --dir e2e test

  docs:
    name: Build Documentation
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid@${{ env.MDBOOK_MERMAID_VERSION }}
      - name: Build mdBook
        run: mdbook build
      - name: Upload Docs Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keel-docs
          path: book/

  container:
    name: Container Image Build (linux/amd64, static musl)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: keel:ci
          cache-from: type=gha,scope=keel-image
          cache-to: type=gha,mode=max,scope=keel-image
      - name: Smoke Test Image
        run: |
          docker run --rm keel:ci --version
          docker run --rm --entrypoint git keel:ci --version
          docker image inspect keel:ci --format 'size={{.Size}} user={{.Config.User}}'
