name: Release

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI Quality Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e-live:
    name: Live E2E Gate
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    name: Automated Release & SBOM
    needs: [ci, e2e-live]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.release-check.outputs.released }}
      tag: ${{ steps.release-check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid,cargo-edit
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Release Dependencies
        run: |
          npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/exec @semantic-release/git @semantic-release/github
      - name: Build Documentation Archive
        run: |
          mdbook build
          mkdir -p dist
          tar -czf dist/keel-docs.tar.gz -C book .
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
      - name: Record Previous Release Tag
        id: prev-tag
        run: |
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Check Release Output
        id: release-check
        run: |
          git fetch --tags --quiet
          after_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          if [ -n "$after_tag" ] && [ "$after_tag" != "${{ steps.prev-tag.outputs.tag }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after_tag" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Docs & SBOM Artifacts
        if: steps.release-check.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keel-release-metadata
          path: |
            dist/keel-docs.tar.gz
            dist/sbom.cdx.json

  build-ui:
    name: Build Release UI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - name: Package UI Archive
        run: |
          mkdir -p dist
          tar -czf dist/keel-ui.tar.gz -C ui/dist .
      - name: Upload UI Dist for Binary Embedding
        uses: actions/upload-artifact@v7
        with:
          name: keel-ui-dist
          path: ui/dist/
          retention-days: 1
      - name: Upload UI Archive Artifact
        uses: actions/upload-artifact@v7
        with:
          name: keel-ui
          path: dist/keel-ui.tar.gz

  build-binaries:
    name: Build Release Binary (${{ matrix.name }})
    needs: [release, build-ui]
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            archive: keel-linux-amd64.tar.gz
            binary: keel
          - name: linux-arm64
            os: ubuntu-26.04
            target: aarch64-unknown-linux-gnu
            archive: keel-linux-arm64.tar.gz
            binary: keel
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: keel-darwin-arm64.tar.gz
            binary: keel
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: keel-windows-amd64.zip
            binary: keel.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 Cross-Linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Download Built UI Assets
        uses: actions/download-artifact@v7
        with:
          name: keel-ui-dist
          path: ui/dist
      - name: Build Keel Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} --bin keel
      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "dist/${{ matrix.archive }}" -Force
      - name: Upload Binary Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: keel-${{ matrix.name }}
          path: dist/${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: [release, build-ui, build-binaries]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: keel-*
          path: artifacts
      - name: Upload Assets & Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            -R "${{ github.repository }}" \
            artifacts/keel-ui/keel-ui.tar.gz \
            artifacts/keel-linux-amd64/keel-linux-amd64.tar.gz \
            artifacts/keel-linux-arm64/keel-linux-arm64.tar.gz \
            artifacts/keel-darwin-arm64/keel-darwin-arm64.tar.gz \
            artifacts/keel-windows-amd64/keel-windows-amd64.zip \
            --clobber
          gh release edit "${{ needs.release.outputs.tag }}" \
            -R "${{ github.repository }}" \
            --draft=false
