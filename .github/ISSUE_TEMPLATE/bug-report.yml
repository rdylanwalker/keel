name: Bug Report
description: Report a bug in the CLI, Web Portal, PR Previews, Flux reconciliation, or Security/RBAC
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI (`keel`)
        - Web Portal (`ui`)
        - PR & PKO v2 Preview Inspector
        - Git Forge (`Forgejo / Gitea / GitHub / GitLab`)
        - Flux CD / Canary / Kyverno / SOPS
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      validations:
        required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `...`
        2. Click '...'
        3. Observe error '...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keel Version / Commit
      placeholder: "e.g., v0.5.0 or main@abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots (redact any secrets)
