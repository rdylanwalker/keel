# Pulumi Kubernetes Operator v2 & Scoped ServiceAccounts (`SDD.md` §2.1, §4.2, `NFR-SEC-03`)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-management-pko
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-preview-readonly
  namespace: keel-previews
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/role: preview-readonly
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulumi-kubernetes-operator
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Adopts the Stage 0 Pulumi release in place: same release name, release namespace
  # (target + storage), chart version and values (`flux_helmreleases_adopt_stage0_releases_in_place`).
  releaseName: pulumi-kubernetes-operator
  targetNamespace: keel-system
  storageNamespace: keel-system
  # Multi-tenancy lockdown: platform releases live in `flux-system` and impersonate the
  # privileged `helm-controller` SA (never the permissionless `default`).
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: pulumi-kubernetes-operator
      version: "2.10.1"
      sourceRef:
        kind: HelmRepository
        name: pulumi
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    replicaCount: 1
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
