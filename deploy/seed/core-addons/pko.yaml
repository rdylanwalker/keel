# Pulumi Kubernetes Operator v2 & Scoped ServiceAccounts (`SDD.md` §2.1, §4.2, `NFR-SEC-03`)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-management-pko
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-preview-readonly
  namespace: keel-previews
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/role: preview-readonly
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulumi-kubernetes-operator
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Adopts the Stage 0 Pulumi release in place: same release name, release namespace
  # (target + storage), chart version and values (`flux_helmreleases_adopt_stage0_releases_in_place`).
  releaseName: pulumi-kubernetes-operator
  targetNamespace: keel-system
  storageNamespace: keel-system
  # Multi-tenancy lockdown: platform releases live in `flux-system` and impersonate the
  # privileged `helm-controller` SA (never the permissionless `default`).
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: pulumi-kubernetes-operator
      # renovate: datasource=docker depName=ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
      version: "2.10.1"
      sourceRef:
        kind: HelmRepository
        name: pulumi
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    replicaCount: 1
    securityContext:
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
    # Pinned (chart default today): the aggregated `edit`/`admin` ClusterRoles grant tenant admins
    # (`tenant-<id>-sa`, used by tenant Flux Kustomizations) their Stacks and Programs. Kyverno
    # `restrict-tenant-pulumi-objects` denies tenants the operator-owned parts they also cover
    # (`auto.pulumi.com` Workspaces/Updates, `stacks/status`, the `keel.io/protect` label).
    rbac:
      createClusterAggregationRoles: true
    # Trust the public Keel CA (`keel-system/keel-ca-bundle`, `ca.crt` only) in addition to the
    # system roots: the controller resolves tenant/preview Stack branches (go-git ls-remote)
    # against the in-cluster Forgejo HTTPS ingress (`forge.publicUrl`). `optional`, so the
    # operator also starts before the bundle exists or without a local CA.
    extraEnv:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/keel-ca
    extraVolumes:
      - name: keel-ca
        configMap:
          name: keel-ca-bundle
          optional: true
    extraVolumeMounts:
      - name: keel-ca
        mountPath: /etc/keel-ca
        readOnly: true
