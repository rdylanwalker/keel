# Rauthy OIDC Identity Provider core add-on (`SDD.md` §2.1, §2.2, §6.1, `NFR-SEC-01`)
# Apache-2.0 licensed, lightweight Rust OIDC provider with embedded Hiqlite DB, Admin UI for
# users/groups/clients, and declarative first-boot JSON seeding.
#
# Plain-manifest add-on: this Flux Kustomization (name == `catalog/core/rauthy` id) reconciles
# `clusters/management/addons/rauthy` (Services, StatefulSet, HTTPRoute) and adopts the Stage 0
# objects created by `deploy/bootstrap/control-plane-rauthy/Pulumi.yaml` in place. The version
# is `spec.images[].newTag` (management API upgrades edit only that tag). The
# `keel-system/rauthy-config` Secret stays Stage 0-managed and is never stored in Git.
# Only written when the built-in Rauthy is enabled (not with `--oidc-issuer` /
# `--oidc-provider none`).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rauthy
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  path: ./clusters/management/addons/rauthy
  targetNamespace: keel-system
  # Never garbage-collect the IdP (or its data PVC) when a manifest is removed from Git.
  prune: false
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  images:
    - name: ghcr.io/sebadob/rauthy
      newTag: "0.37.2"
  # Health is reported on this object only; `core-addons` does not wait on it.
  wait: false
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: rauthy
      namespace: keel-system
