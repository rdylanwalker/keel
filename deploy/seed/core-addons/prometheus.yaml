# yaml-language-server: $schema=none
# Prometheus Server for Control-Plane Telemetry & Flagger Canary Rollbacks (`SDD.md` §5.2, `NFR-REL-03`, `NFR-OBS-02`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Same release name/namespace as the Stage 0 Pulumi install so Flux adopts it in place.
  storageNamespace: keel-system
  releaseName: prometheus
  chart:
    spec:
      chart: prometheus
      version: "29.48.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: keel-system
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      fullnameOverride: prometheus
      retention: 7d
      persistentVolume:
        enabled: false
