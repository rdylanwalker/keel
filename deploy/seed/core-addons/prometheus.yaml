# yaml-language-server: $schema=none
# Prometheus Server for Control-Plane Telemetry & Flagger Canary Rollbacks (`SDD.md` §5.2, `NFR-REL-03`, `NFR-OBS-02`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Adopts the Stage 0 Pulumi release in place: same release name, release namespace
  # (target + storage), chart version and values (`flux_helmreleases_adopt_stage0_releases_in_place`).
  releaseName: prometheus
  targetNamespace: keel-system
  storageNamespace: keel-system
  # Multi-tenancy lockdown: platform releases live in `flux-system` and impersonate the
  # privileged `helm-controller` SA (never the permissionless `default`).
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: prometheus
      version: "29.48.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      fullnameOverride: prometheus
      retention: 7d
      persistentVolume:
        enabled: false
