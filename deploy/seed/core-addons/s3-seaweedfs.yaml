# Seed S3-Compatible State Backend (SeaweedFS, Apache-2.0 — `SDD.md` §2.1, `NFR-REL-01`, `NFR-REL-04`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: s3-state-backend
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Adopts the Stage 0 Pulumi release in place: same release name, release namespace
  # (target + storage), chart version and values (`flux_helmreleases_adopt_stage0_releases_in_place`).
  releaseName: s3-state-backend
  targetNamespace: keel-system
  storageNamespace: keel-system
  # Multi-tenancy lockdown: platform releases live in `flux-system` and impersonate the
  # privileged `helm-controller` SA (never the permissionless `default`).
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: seaweedfs
      # renovate: datasource=helm depName=seaweedfs registryUrl=https://seaweedfs.github.io/seaweedfs/helm
      version: "4.54.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    s3:
      enabled: true
      enableAuth: true
      logs:
        type: emptyDir
    master:
      logs:
        type: emptyDir
      data:
        type: persistentVolumeClaim
        size: 1Gi
    filer:
      logs:
        type: emptyDir
      data:
        type: persistentVolumeClaim
        size: 2Gi
    volume:
      logs:
        type: emptyDir
      idx:
        type: persistentVolumeClaim
        size: 2Gi
      dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 10Gi
          maxVolumes: 0
