# Seed S3-Compatible State Backend (SeaweedFS, Apache-2.0 — `SDD.md` §2.1, `NFR-REL-01`, `NFR-REL-04`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: s3-state-backend
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Same release name/namespace as the Stage 0 Pulumi install so Flux adopts it in place.
  storageNamespace: keel-system
  releaseName: s3-state-backend
  chart:
    spec:
      chart: seaweedfs
      version: "4.54.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: keel-system
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    s3:
      enabled: true
      enableAuth: true
      logs:
        type: emptyDir
    master:
      logs:
        type: emptyDir
      data:
        type: persistentVolumeClaim
        size: 1Gi
    filer:
      logs:
        type: emptyDir
      data:
        type: persistentVolumeClaim
        size: 2Gi
    volume:
      logs:
        type: emptyDir
      idx:
        type: persistentVolumeClaim
        size: 2Gi
      dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 10Gi
          maxVolumes: 0
