# Optional in-cluster keel-server (`keel bootstrap init --with-keel-server`, `SDD.md` §2.1, §2.2, §6.3)
# Only written to Git (and listed in `kustomization.yaml`) with `--with-keel-server`, together with
# `catalog/core/keel-server/catalog.yaml` and `clusters/management/addons/keel-server/`.
#
# Plain-manifest add-on: this Flux Kustomization (name == `catalog/core/keel-server` id) reconciles
# `clusters/management/addons/keel-server` (least-privilege RBAC, Deployment, Service, the rendered
# `keel-server-config` ConfigMap and the `keel-server-ingress` HTTPRoute). There is no Stage 0
# install: Flux is the only owner.
#
# - Version: `spec.images[].newTag` pins `ghcr.io/rdylanwalker/keel` to the release tag of the
#   `keel` CLI that bootstrapped the cluster (never `latest`); management API upgrades edit only
#   that tag.
# - No `targetNamespace`: the bundle spans `keel-system`, `keel-previews`, `flux-system` and
#   cluster-scoped RBAC, and every namespaced object names its namespace explicitly
#   (a `targetNamespace` would collapse the per-namespace Roles/RoleBindings into one namespace).
# - Secrets are never stored in Git: `KEEL_GIT_TOKEN` comes from the `keel-system/forge-token`
#   Secret (created by Stage 0 with `--with-forge`, or from `--git-token` with `--git-url`); the
#   session key is generated by the server into a Kubernetes Secret at runtime.
# - `prune: true`: the server is stateless, so RBAC objects dropped from Git are garbage-collected
#   (least privilege). `keel.io/protect` + `prune: disabled` keep the add-on itself from being
#   removed by accident.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keel-server
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  path: ./clusters/management/addons/keel-server
  prune: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  images:
    - name: ghcr.io/rdylanwalker/keel
      newTag: "0.15.0"
  # Health is reported on this object only; `core-addons` does not wait on it.
  wait: false
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: keel-server
      namespace: keel-system
