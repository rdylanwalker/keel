# Flagger Progressive Delivery Controller integrated with Gateway API & Prometheus (`SDD.md` §5.2, `NFR-REL-03`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Adopts the Stage 0 Pulumi release in place: same release name, release namespace
  # (target + storage), chart version and values (`flux_helmreleases_adopt_stage0_releases_in_place`).
  releaseName: flagger
  targetNamespace: keel-system
  storageNamespace: keel-system
  # Multi-tenancy lockdown: platform releases live in `flux-system` and impersonate the
  # privileged `helm-controller` SA (never the permissionless `default`).
  serviceAccountName: helm-controller
  dependsOn:
    - name: envoy-gateway
    - name: prometheus
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    meshProvider: gatewayapi:v1
    metricsServer: http://prometheus.keel-system.svc.cluster.local:80
    podMonitor:
      enabled: false
