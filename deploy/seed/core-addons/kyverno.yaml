# Kyverno admission controller (`SDD.md` §6.2, `NFR-SEC-04`).
# Adopts the Stage 0 release installed by `deploy/bootstrap/control-plane/Pulumi.yaml` in place:
# same release name (`kyverno`), release namespace (`keel-system`), chart version and values. Chart 3.10.0
# ships CRDs serving `policies.kyverno.io/v1` (ValidatingPolicy, GeneratingPolicy, PolicyException)
# used by Keel's policies (generated at bootstrap into `core-addons/kyverno-policies.yaml`). The `# keel:policy-exceptions` marker is rendered by
# `keel bootstrap init` to mirror `--local-dev-docker-socket-exception`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  # Adopts the Stage 0 Pulumi release in place: same release name, release namespace
  # (target + storage), chart version and values (`flux_helmreleases_adopt_stage0_releases_in_place`).
  releaseName: kyverno
  targetNamespace: keel-system
  storageNamespace: keel-system
  # Multi-tenancy lockdown: platform releases live in `flux-system` and impersonate the
  # privileged `helm-controller` SA (never the permissionless `default`).
  serviceAccountName: helm-controller
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
  values:
    # Keel only uses the CEL `policies.kyverno.io/v1` policy types. Kyverno 1.20 no longer
    # executes the deprecated `kyverno.io` policy kinds, and installing their CRDs only makes
    # the controllers emit deprecation warnings, so they are not installed.
    crds:
      groups:
        kyverno:
          clusterpolicies: false
          policies: false
          policyexceptions: false
          cleanuppolicies: false
          clustercleanuppolicies: false
    admissionController:
      replicas: 1
    features:
      policyExceptions:
        enabled: true # keel:policy-exceptions
        namespace: keel-system
