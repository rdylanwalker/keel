# Kyverno Admission Controller with `PolicyException` restricted to `keel-system` (`SDD.md` §6.2, `NFR-SEC-04`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.3.7"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: keel-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admissionController:
      replicas: 2
      container:
        extraArgs:
          enablePolicyException: "true"
          exceptionNamespace: keel-system
    backgroundController:
      enabled: true
    cleanupController:
      enabled: true
    reportsController:
      enabled: true
