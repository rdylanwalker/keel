# Envoy Gateway Controller & Default Gateway API Listener (`SDD.md` §2.1, §5.2)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 10m
  chart:
    spec:
      chart: gateway-helm
      version: "v1.3.0"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: keel-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    timeout: 5m
    remediation:
      retries: 1
      strategy: rollback
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: keel-envoy
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keel-ingress
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  gatewayClassName: keel-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: keel-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
