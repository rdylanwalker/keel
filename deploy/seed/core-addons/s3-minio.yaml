# Seed S3-Compatible State Backend (`pulumi-state` with Bucket Versioning — `SDD.md` §2.1, `NFR-REL-01`, `NFR-REL-04`)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: s3-state-backend
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 10m
  chart:
    spec:
      chart: minio
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: keel-system
  values:
    mode: standalone
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
    buckets:
      - name: pulumi-state
        policy: none
        purge: false
        versioning: true
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
