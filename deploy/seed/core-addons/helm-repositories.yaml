# Upstream Helm & OCI Chart Sources for Seed Control-Plane Addons (`SDD.md` §2.1, `NFR-DEVOPS-01`)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pulumi
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  type: oci
  interval: 30m
  url: oci://ghcr.io/pulumi/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 30m
  url: https://kyverno.github.io/kyverno/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  type: oci
  interval: 30m
  url: oci://docker.io/envoyproxy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 30m
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flagger
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 30m
  url: https://flagger.app
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 30m
  url: https://seaweedfs.github.io/seaweedfs/helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 30m
  url: https://charts.dexidp.io
