# Upstream Helm & OCI Chart Sources for Seed Control-Plane Addons (`SDD.md` §2.1, `NFR-DEVOPS-01`)
# Only charts of management base add-ons live here. Self-service catalog apps (`catalog/apps/*`,
# e.g. Dex) get their own instance-scoped HelmRepository in the tenant namespace on install
# (Flux `--no-cross-namespace-refs` forbids tenant HelmReleases from using these).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pulumi
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  type: oci
  interval: 30m
  url: oci://ghcr.io/pulumi/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 30m
  url: https://kyverno.github.io/kyverno/
---
