# Root Seed Control-Plane Layout (`SDD.md` §2.1, §3.1)
# Installed identically across all Stage 0 BootstrapTargets (`kind`, `kubeconfig`, `proxmox`, `aws`, `gcp`, `azure`, `hetzner`).
# This tree is the template of the GitOps repository's `clusters/management/` layout; `keel
# bootstrap init` renders it (ingress hosts, Kyverno bundle, GitRepository URL) before writing it to
# Git. Flux reconciles `flux-system/`, `core-addons/` and `addons/<id>/` through separate Flux
# Kustomizations (`flux-system/gotk-sync.yaml`), and `kyverno-policies/` is rendered into
# `core-addons/kyverno-policies.yaml`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - flux-system
  - core-addons
  - management-stack.yaml
