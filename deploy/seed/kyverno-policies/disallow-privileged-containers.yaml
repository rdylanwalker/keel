# Kyverno ValidatingPolicy: disallow-privileged-containers (NFR-SEC-03, NFR-SEC-04)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: baseline-security
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: tenant-or-preview-namespace
      expression: "request.namespace == 'keel-previews' || request.namespace.startsWith('tenant-')"
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && ((has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot) || (has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot)) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)
      message: "Privileged containers and privilege escalation are prohibited; pods must adhere to restricted PSS."
    - expression: >-
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))) && object.spec.containers.all(c, !has(c.env) || c.env.all(e, e.name != 'DOCKER_HOST'))
      message: "Mounting hostPath volumes (such as /var/run/docker.sock) or injecting DOCKER_HOST is forbidden in production."
