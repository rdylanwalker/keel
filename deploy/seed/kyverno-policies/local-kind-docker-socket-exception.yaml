# OPT-IN LOCAL DEVELOPMENT ONLY — NOT APPLIED IN PRODUCTION (`NFR-SEC-03`, `NFR-SEC-04`)
#
# This `kyverno.io/v2` `PolicyException` is deliberately excluded from the default
# `kyverno-policies/kustomization.yaml`. It is synthesized and applied ONLY when an operator
# explicitly passes `--local-dev-docker-socket-exception` on a local `kind` management cluster:
#
#   keel bootstrap init --target kind --local-dev-docker-socket-exception
#
# Purpose:
# Allows Pulumi Kubernetes Operator (`app.kubernetes.io/managed-by: pulumi-kubernetes-operator`)
# workspace pods in `keel-previews` and `tenant-*` to access `/var/run/docker.sock` or `DOCKER_HOST`
# strictly for nested local `kind` workload cluster provisioning (`catalog/infra/kind-cluster`).
# Stored in `keel-system` so tenant namespaces cannot self-create or modify `PolicyException` CRs.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: local-kind-docker-socket-exception
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/local-dev-only: "true"
  annotations:
    keel.io/description: "Explicit local-dev exception allowing PKO workspace pods to access Docker socket / DOCKER_HOST for nested kind provisioning."
spec:
  exceptions:
    - policyName: disallow-privileged-containers
      ruleNames:
        - disallow-privileged
        - disallow-host-path-and-docker-socket
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - keel-previews
            - tenant-*
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: pulumi-kubernetes-operator
  conditions:
    any:
      - key: "{{ request.object.spec.volumes[].hostPath.path || `[]` }}"
        operator: AllIn
        value:
          - /var/run/docker.sock
      - key: "{{ request.object.spec.containers[].env[].name || `[]` }}"
        operator: AnyIn
        value:
          - DOCKER_HOST
