# OPT-IN LOCAL DEVELOPMENT ONLY — NOT APPLIED IN PRODUCTION (`NFR-SEC-03`, `NFR-SEC-04`)
#
# Deliberately excluded from the default `kyverno-policies/kustomization.yaml`. Synthesized and
# applied ONLY when an operator explicitly opts in on a local `kind` management cluster:
#
#   keel bootstrap init --target kind --local-dev-docker-socket-exception
#
# Mirrors `keel_kube::kyverno::build_local_kind_docker_socket_exception()` with default config.
# `disallow-privileged-containers` is a CEL `ValidatingPolicy` (no named rules), so this uses the
# `policies.kyverno.io/v1` PolicyException with `policyRefs` + CEL `matchConditions`. It exempts
# only PKO workspace pods (`auto.pulumi.com/component: workspace`) in `keel-previews` / `tenant-*`
# that mount `/var/run/docker.sock` or set `DOCKER_HOST`, for nested `kind` provisioning.
# Stored in `keel-system` (Kyverno's configured exception namespace) so tenants cannot self-exempt.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: local-kind-docker-socket-exception
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/local-dev-only: "true"
  annotations:
    keel.io/description: "Explicit local-dev exception allowing PKO workspace pods to access Docker socket / DOCKER_HOST for nested kind provisioning."
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-privileged-containers
  matchConditions:
    - name: allowed-namespaces
      expression: "(has(request.namespace) ? request.namespace : '') == 'keel-previews' || (has(request.namespace) ? request.namespace : '').startsWith('tenant-')"
    - name: pko-workspace-pod-labels
      expression: >-
        ((has(object.metadata.labels) && ('auto.pulumi.com/component' in object.metadata.labels) && object.metadata.labels['auto.pulumi.com/component'] == 'workspace') || (has(object.spec.template) && has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && ('auto.pulumi.com/component' in object.spec.template.metadata.labels) && object.spec.template.metadata.labels['auto.pulumi.com/component'] == 'workspace'))
    - name: docker-socket-or-host
      expression: >-
        (((has(object.spec.volumes) && object.spec.volumes.exists(v, has(v.hostPath) && v.hostPath.path == '/var/run/docker.sock')) || (has(object.spec.containers) && object.spec.containers.exists(c, has(c.env) && c.env.exists(e, e.name == 'DOCKER_HOST'))))) || (has(object.spec.template) && has(object.spec.template.spec) && ((has(object.spec.template.spec.volumes) && object.spec.template.spec.volumes.exists(v, has(v.hostPath) && v.hostPath.path == '/var/run/docker.sock')) || (has(object.spec.template.spec.containers) && object.spec.template.spec.containers.exists(c, has(c.env) && c.env.exists(e, e.name == 'DOCKER_HOST')))))
