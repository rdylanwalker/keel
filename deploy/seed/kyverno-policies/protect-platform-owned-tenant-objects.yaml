# Kyverno ValidatingPolicy: protect-platform-owned-tenant-objects (NFR-SEC-02, NFR-SEC-04)
# Mirrors `keel_kube::kyverno::build_protect_platform_owned_tenant_objects_policy()`.
# Objects the platform writes for a tenant carry `keel.io/platform-owned: "true"` (tenant
# Namespace, ServiceAccount, quota, LimitRange, NetworkPolicies, RoleBindings, the
# `keel-gitops` GitRepository stub). Creating, changing (including dropping the label) or deleting
# them is reserved for keel-tenant-reconciler (`keel-tenants`), keel-server, source-controller (its
# own GitRepository finalizer only), the kube-system controllers (garbage collection, namespace
# deletion) and break-glass cluster admins (`system:masters`, `kubeadm:cluster-admins`). Tenant
# identities, which hold `admin` in their namespace, and other flux-system identities such as
# kustomize-controller (every flux-system Kustomization) are denied. The only exemption is an UPDATE
# of the `keel-gitops` GitRepository that changes nothing but the `reconcile.fluxcd.io/requestedAt`
# annotation (`flux reconcile source git keel-gitops -n tenant-<id>`). Fails closed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-platform-owned-tenant-objects
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: tenant-isolation
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces", "serviceaccounts", "resourcequotas", "limitranges"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings", "clusterrolebindings"]
      - apiGroups: ["source.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["gitrepositories"]
  matchConditions:
    - name: platform-owned
      expression: >-
        (object != null && has(object.metadata) && has(object.metadata.labels) && 'keel.io/platform-owned' in object.metadata.labels) || (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.labels) && 'keel.io/platform-owned' in oldObject.metadata.labels)
  variables:
    - name: username
      expression: "has(request.userInfo.username) ? request.userInfo.username : ''"
    - name: groups
      expression: "has(request.userInfo.groups) ? request.userInfo.groups : []"
  validations:
    - expression: >-
        variables.username in ['system:serviceaccount:flux-system:keel-tenant-reconciler', 'system:serviceaccount:keel-system:keel-server', 'system:kube-controller-manager'] || (variables.username == 'system:serviceaccount:flux-system:source-controller' && request.kind.kind == 'GitRepository') || variables.username.startsWith('system:serviceaccount:kube-system:') || variables.groups.exists(g, g == 'system:masters' || g == 'kubeadm:cluster-admins') || (request.operation == 'UPDATE' && request.kind.group == 'source.toolkit.fluxcd.io' && request.kind.kind == 'GitRepository' && object != null && oldObject != null && (has(object.spec) ? object.spec : {}) == (has(oldObject.spec) ? oldObject.spec : {}) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) && (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) && (has(object.metadata.annotations) ? object.metadata.annotations : {}).all(k, k == 'reconcile.fluxcd.io/requestedAt' || (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == object.metadata.annotations[k])) && (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}).all(k, k == 'reconcile.fluxcd.io/requestedAt' || (has(object.metadata.annotations) && k in object.metadata.annotations)))
      message: "Objects labelled `keel.io/platform-owned` (tenant namespace, RBAC, NetworkPolicies, the `keel-gitops` source) are managed by the platform (keel-tenant-reconciler / keel-server); change them through a GitOps PR to `tenants/<id>/` (only a `reconcile.fluxcd.io/requestedAt` reconcile request on `keel-gitops` is exempt)."
