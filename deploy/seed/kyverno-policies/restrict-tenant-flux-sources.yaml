# Kyverno ValidatingPolicy: restrict-tenant-flux-sources (NFR-SEC-02, NFR-SEC-04)
# Mirrors `keel_kube::kyverno::build_restrict_tenant_flux_sources_policy()`.
# Closes the Flux source paths that would let a tenant republish or substitute another source's
# content. Fails closed. `matchConditions` limit the webhook to writes in `tenant-*` namespaces, so
# `flux-system` writes never reach Kyverno (anti-lockout, NFR-REL-01). Status writes by tenant
# identities are denied by `restrict-tenant-flux-source-status`.
# * `ExternalArtifact` and every `source.extensions.fluxcd.io` kind (`ArtifactGenerator`) are
#   denied in `tenant-*` namespaces (they would republish the whole-repository artifact);
#   updates that keep `spec` unchanged, objects being deleted and deletions pass (finalizers).
# * Flux Kustomizations in `tenant-<id>` must impersonate `tenant-<id>-sa`; updates that keep
#   `spec` unchanged (finalizers, reconcile annotations) and deletions are always allowed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-flux-sources
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: tenant-isolation
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["source.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalartifacts"]
      - apiGroups: ["source.extensions.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
      - apiGroups: ["kustomize.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kustomizations"]
  matchConditions:
    - name: tenant-namespace
      expression: "(has(request.namespace) ? request.namespace : '').startsWith('tenant-')"
  variables:
    - name: ns
      expression: "(has(request.namespace) ? request.namespace : '')"
  validations:
    - expression: >-
        !((request.kind.group == 'source.toolkit.fluxcd.io' && request.kind.kind == 'ExternalArtifact') || request.kind.group == 'source.extensions.fluxcd.io') || (request.operation == 'UPDATE' && (has(object.metadata.deletionTimestamp) || (has(object.spec) ? object.spec : {}) == (has(oldObject.spec) ? oldObject.spec : {})))
      message: "ExternalArtifact and ArtifactGenerator objects are not allowed in tenant namespaces: they would republish another source's artifact (whole-repository read). Tenants only use their own GitRepository `keel-gitops`."
    - expression: >-
        !(request.kind.group == 'kustomize.toolkit.fluxcd.io' && request.kind.kind == 'Kustomization') || (has(object.spec) && has(object.spec.serviceAccountName) && object.spec.serviceAccountName == variables.ns + '-sa') || (request.operation == 'UPDATE' && (has(object.metadata.deletionTimestamp) || (has(object.spec) ? object.spec : {}) == (has(oldObject.spec) ? oldObject.spec : {})))
      message: "Flux Kustomizations in a tenant namespace `tenant-<id>` must set `spec.serviceAccountName: tenant-<id>-sa` (multi-tenancy lockdown, NFR-SEC-02)."
