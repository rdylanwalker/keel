# Default production Kyverno policy bundle (`Enforce` mode).
# NOTE: `local-kind-docker-socket-exception.yaml` is intentionally omitted here and is only
# applied when `--target kind --local-dev-docker-socket-exception` is explicitly requested.
# The former `sync-tenant-secrets` GeneratingPolicy (which cloned control-plane admin S3/Git
# credentials into every tenant) is retired; tenants receive dedicated least-privilege
# credentials (`tenant-<id>/keel-tenant-s3-credentials`, read-only `tenant-<id>/git-credentials`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - disallow-privileged-containers.yaml
  - protect-control-plane.yaml
  - restrict-pulumi-providers.yaml
  - restrict-tenant-reconciler.yaml
  - restrict-tenant-route-hostnames.yaml
  - restrict-tenant-flux-sources.yaml
  - restrict-tenant-flux-source-status.yaml
  - protect-platform-owned-tenant-objects.yaml
