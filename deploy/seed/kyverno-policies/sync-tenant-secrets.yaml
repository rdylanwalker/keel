# Kyverno GeneratingPolicy + scoped RBAC to clone and synchronize
# `keel-s3-credentials` and `git-credentials` from `flux-system` into every `tenant-*` namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keel-kyverno-tenant-secret-sync
  labels:
    app.kubernetes.io/managed-by: keel
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keel-s3-credentials", "git-credentials"]
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keel-kyverno-tenant-secret-sync
  labels:
    app.kubernetes.io/managed-by: keel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keel-kyverno-tenant-secret-sync
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-tenant-secrets
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: tenant-secret-sync
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: tenant-namespace
      expression: "object.metadata.name.startsWith('tenant-')"
  variables:
    - name: s3Secret
      expression: "resource.Get('v1', 'secrets', 'flux-system', 'keel-s3-credentials')"
    - name: gitSecret
      expression: "resource.Get('v1', 'secrets', 'flux-system', 'git-credentials')"
  generate:
    - expression: >-
        generator.Apply(object.metadata.name, [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": "keel-s3-credentials",
              "labels": {
                "app.kubernetes.io/managed-by": "keel",
                "keel.io/secret-kind": "s3-credentials"
              }
            }),
            "type": dyn(variables.s3Secret.type),
            "data": dyn(variables.s3Secret.data)
          },
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": "git-credentials",
              "labels": {
                "app.kubernetes.io/managed-by": "keel",
                "keel.io/secret-kind": "git-credentials"
              }
            }),
            "type": dyn(variables.gitSecret.type),
            "data": dyn(variables.gitSecret.data)
          }
        ])
