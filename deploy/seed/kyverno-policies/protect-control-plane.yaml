# Kyverno ValidatingPolicy: protect-control-plane (NFR-REL-01, NFR-SEC-04)
# Mirrors `keel_kube::kyverno::build_protect_control_plane_policy()` (drift-tested), which is what
# `keel bootstrap init` applies. This copy is kept for operators applying it by hand (see
# `docs/catalog/keel-server.md`).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-control-plane
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: anti-lockout
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["pulumi.com"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["stacks"]
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*"]
  validations:
    - expression: >-
        !(request.operation == 'DELETE' && request.kind.group == 'pulumi.com' && request.kind.kind == 'Stack' && (oldObject.metadata.name == 'management-cluster-core' || (has(oldObject.metadata.labels) && 'keel.io/protect' in oldObject.metadata.labels && oldObject.metadata.labels['keel.io/protect'] == 'true')))
      message: "Protected control-plane Stack `management-cluster-core` cannot be deleted via standard admission; use `keel bootstrap recover` for break-glass maintenance."
    - expression: >-
        !(((has(request.namespace) ? request.namespace : '') == 'flux-system' || (has(request.namespace) ? request.namespace : '') == 'keel-system') && has(request.userInfo) && has(request.userInfo.username) && (request.userInfo.username.startsWith('system:serviceaccount:keel-previews:') || request.userInfo.username.startsWith('system:serviceaccount:tenant-')))
      message: "Tenant and preview ServiceAccounts are strictly prohibited from mutating control-plane namespaces."
    - expression: >-
        !(request.operation == 'DELETE' && (has(request.namespace) ? request.namespace : '') == 'flux-system' && ((request.kind.group == 'helm.toolkit.fluxcd.io' && request.kind.kind == 'HelmRelease') || (request.kind.group == 'kustomize.toolkit.fluxcd.io' && request.kind.kind == 'Kustomization')) && has(oldObject.metadata.labels) && 'keel.io/protect' in oldObject.metadata.labels && oldObject.metadata.labels['keel.io/protect'] == 'true')
      message: 'Protected control-plane Flux objects (`keel.io/protect: "true"`, e.g. the `flux2` HelmRelease whose deletion would uninstall Flux) cannot be deleted; break-glass: suspend the parent Kustomization (e.g. `core-addons`) or remove the label in Git, then remove the `keel.io/protect` label and delete.'
    - expression: >-
        !(request.operation == 'UPDATE' && ((has(request.namespace) ? request.namespace : '') == 'flux-system' || (has(request.namespace) ? request.namespace : '') == 'keel-system') && has(request.userInfo) && has(request.userInfo.username) && request.userInfo.username == 'system:serviceaccount:keel-system:keel-server' && ((request.kind.group == 'kustomize.toolkit.fluxcd.io' && request.kind.kind == 'Kustomization') || (request.kind.group == 'helm.toolkit.fluxcd.io' && request.kind.kind == 'HelmRelease') || request.kind.group == 'source.toolkit.fluxcd.io' || (request.kind.group == 'pulumi.com' && request.kind.kind == 'Stack')) && !((has(object.spec) ? object.spec : {}) == (has(oldObject.spec) ? oldObject.spec : {}) && (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) && (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) && (has(object.metadata.annotations) ? object.metadata.annotations : {}).all(k, k == 'reconcile.fluxcd.io/requestedAt' || k == 'pulumi.com/reconcile-request' || (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == object.metadata.annotations[k])) && (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}).all(k, k == 'reconcile.fluxcd.io/requestedAt' || k == 'pulumi.com/reconcile-request' || (has(object.metadata.annotations) && k in object.metadata.annotations))))
      message: "keel-server may only request reconciliation (`reconcile.fluxcd.io/requestedAt` / `pulumi.com/reconcile-request` annotations) on control-plane Flux objects and Stacks; spec, label, finalizer and other annotation changes must go through a GitOps PR."
