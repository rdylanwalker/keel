# Kyverno ValidatingPolicy: restrict-pulumi-providers
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-pulumi-providers
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: provider-governance
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: ["pulumi.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["stacks"]
  matchConditions:
    - name: tenant-or-preview-namespace
      expression: "(has(request.namespace) ? request.namespace : '') == 'keel-previews' || (has(request.namespace) ? request.namespace : '').startsWith('tenant-')"
  validations:
    - expression: >-
        has(object.metadata.labels) && ('keel.io/provider' in object.metadata.labels) && object.metadata.labels['keel.io/provider'] in ["kind","proxmox","aws","gcp","azure","hetzner"]
      message: "Stack `keel.io/provider` label must be one of the enabled providers: kind | proxmox | aws | gcp | azure | hetzner"
