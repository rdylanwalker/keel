# Kyverno ValidatingPolicy: restrict-tenant-route-hostnames (NFR-SEC-02, NFR-SEC-04)
# Mirrors `keel_kube::kyverno::build_restrict_tenant_route_hostnames_policy()` for the default
# `keel.local` platform hosts; `keel bootstrap init` renders the deny list from the configured
# `--oidc-public-url` (IdP host plus `keel.`/`forgejo.`/`idp.` under its base domain).
# Tenant Gateway API routes share the `keel-system/keel-ingress` listeners; Gateway API breaks
# exact-hostname ties by creation time, so a tenant route must never claim a platform host (or a
# wildcard covering one). Fails closed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-route-hostnames
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/policy-tier: tenant-isolation
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "grpcroutes", "tlsroutes"]
  matchConditions:
    - name: tenant-namespace
      expression: "(has(request.namespace) ? request.namespace : '').startsWith('tenant-')"
  variables:
    - name: deniedHostnames
      expression: "['*.keel.local', '*.local', 'forgejo.keel.local', 'idp.keel.local', 'keel.keel.local']"
    - name: hostnames
      expression: "has(object.spec.hostnames) ? object.spec.hostnames : []"
  validations:
    - expression: "variables.hostnames.all(h, !(h in variables.deniedHostnames))"
      message: "Tenant routes may not claim reserved platform hostnames (IdP, keel-server, Forgejo) or wildcards covering them."
