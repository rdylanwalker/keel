# keel-server portal/API route on both `keel-ingress` HTTPS listeners. `${KEEL_HOST}`
# (`keel.<domain>`) is rendered at bootstrap time from `--oidc-public-url`; the Stage 0 Rauthy
# `keel-server` client already allows `https://${KEEL_HOST}[:port]/api/v1/auth/callback`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keel-server-ingress
  namespace: keel-system
  labels:
    app.kubernetes.io/name: keel-server
    app.kubernetes.io/managed-by: keel
spec:
  parentRefs:
    - name: keel-ingress
      namespace: keel-system
      sectionName: https-local
    - name: keel-ingress
      namespace: keel-system
      sectionName: https
  hostnames:
    - ${KEEL_HOST}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keel-server
          port: 8080
