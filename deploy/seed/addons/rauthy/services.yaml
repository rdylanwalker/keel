# Rauthy HTTP Service and Hiqlite raft headless Service.
apiVersion: v1
kind: Service
metadata:
  name: rauthy
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    app: rauthy
    keel.io/protect: "true"
spec:
  selector:
    app: rauthy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rauthy-headless
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    app: rauthy
    keel.io/protect: "true"
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rauthy
  ports:
    - name: hiqlite-raft
      port: 8100
      targetPort: 8100
    - name: hiqlite-api
      port: 8200
      targetPort: 8200
