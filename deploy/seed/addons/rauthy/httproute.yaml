# Rauthy ingress route on both `keel-ingress` HTTPS listeners. `${IDP_HOST}` is rendered at
# bootstrap time from `--oidc-public-url`; the same rendered document is applied by Stage 0.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rauthy-ingress
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  parentRefs:
    - name: keel-ingress
      namespace: keel-system
      sectionName: https-local
    - name: keel-ingress
      namespace: keel-system
      sectionName: https
  hostnames:
    - ${IDP_HOST}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rauthy
          port: 8080
