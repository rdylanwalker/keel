# Flux CD Control-Plane Kustomization enforcing strict multi-tenancy (`--no-cross-namespace-refs=true`, `NFR-SEC-02`)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - git-repository.yaml
  - gotk-sync.yaml
patches:
  - target:
      kind: Deployment
      name: "(kustomize-controller|helm-controller)"
      namespace: flux-system
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --no-cross-namespace-refs=true
