# Flux CD Seed Kustomizations with SOPS + `age` Decryption (`SDD.md` §3.1, §6.2, §6.3)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 5m
  path: ./clusters/management/flux-system
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-addons
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 5m
  path: ./clusters/management/core-addons
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants-root
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 1m
  path: ./tenants
  prune: true
  dependsOn:
    - name: core-addons
  sourceRef:
    kind: GitRepository
    name: flux-system
