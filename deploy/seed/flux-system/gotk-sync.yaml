# Flux CD Root Kustomizations with SOPS + `age` Decryption (`SDD.md` §2.1, §2.2, §3.1, §6.2, §6.3)
#
# Canonical set: `keel bootstrap init` writes this file verbatim to
# `clusters/management/flux-system/gotk-sync.yaml` AND applies it in-cluster (embedded with
# `include_str!`), so the live objects and Git always match. `flux-system` then keeps this file
# (and the GitRepository / tenant reconciler RBAC next to it) reconciled from Git.
#
# Flux runs in multi-tenancy lockdown (`--no-cross-namespace-refs=true`,
# `--default-service-account=default`, set via the flux2 chart `multitenancy` values in
# `deploy/bootstrap/control-plane/Pulumi.yaml`). Every Kustomization therefore names the
# ServiceAccount it impersonates: platform Kustomizations use the privileged
# `kustomize-controller`; `keel-tenants` uses the confined `keel-tenant-reconciler`. The core
# add-on HelmReleases (and their HelmRepositories) also live in `flux-system` and impersonate
# `helm-controller` (`targetNamespace`/`storageNamespace: keel-system`); `keel-system` holds no
# privileged reconciler identity that a namespaced writer there could borrow.
#
# Prune safety: `flux-system` applies this file with `prune: true`, so every root Kustomization
# carries `kustomize.toolkit.fluxcd.io/prune: disabled` and is never garbage-collected (with its
# whole inventory) when its document is dropped from Git.
#
# Health gating: `flux-system` and `core-addons` only create Flux objects (GitRepository,
# Kustomizations, HelmRepositories, one HelmRelease / Kustomization per base add-on) plus a few
# supporting documents, so they run with `wait: false`. Their Ready condition means "applied",
# while every add-on reports its own health on its own Flux object (HelmRelease remediation,
# Kustomization `healthChecks`). A broken optional add-on therefore never blocks `keel-tenants`,
# which still only starts after `core-addons` has been applied (CRDs, HelmRepositories, policies).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
  annotations:
    # Never garbage-collected by the `flux-system` Kustomization (which applies this file with
    # `prune: true`): dropping or renaming this document in Git must not prune it (and with it
    # its whole inventory, e.g. every tenant namespace) (`NFR-REL-01`).
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 5m
  path: ./clusters/management/flux-system
  prune: true
  wait: false
  timeout: 5m
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-addons
  namespace: flux-system
  annotations:
    # Never garbage-collected by the `flux-system` Kustomization (which applies this file with
    # `prune: true`): dropping or renaming this document in Git must not prune it (and with it
    # its whole inventory, e.g. every tenant namespace) (`NFR-REL-01`).
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
spec:
  interval: 5m
  path: ./clusters/management/core-addons
  # Removing an add-on manifest from Git never uninstalls a live control-plane add-on.
  prune: false
  wait: false
  timeout: 5m
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keel-tenants
  namespace: flux-system
  annotations:
    # Never garbage-collected by the `flux-system` Kustomization (which applies this file with
    # `prune: true`): dropping or renaming this document in Git must not prune it (and with it
    # its whole inventory, e.g. every tenant namespace) (`NFR-REL-01`).
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 1m
  path: ./tenants
  prune: true
  # Never cluster-admin: may only manage tenant-* namespaces and bind ClusterRole/admin
  # (namespaced) or system:auth-delegator (see tenant-reconciler-rbac.yaml and the Kyverno
  # `restrict-tenant-reconciler` ValidatingPolicy).
  serviceAccountName: keel-tenant-reconciler
  dependsOn:
    - name: core-addons
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
