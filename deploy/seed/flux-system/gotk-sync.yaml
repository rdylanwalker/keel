# Flux CD Seed Kustomizations with SOPS + `age` Decryption (`SDD.md` §3.1, §6.2, §6.3)
#
# Flux runs in multi-tenancy lockdown (`--no-cross-namespace-refs=true`,
# `--default-service-account=default`, set via the flux2 chart `multitenancy` values in
# `deploy/bootstrap/control-plane/Pulumi.yaml`). Every Kustomization therefore names the
# ServiceAccount it impersonates: platform Kustomizations use the privileged
# `kustomize-controller`; `tenants-root` uses the confined `keel-tenant-reconciler`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 5m
  path: ./clusters/management/flux-system
  prune: true
  wait: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-addons
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 5m
  path: ./clusters/management/core-addons
  prune: false
  wait: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants-root
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  interval: 1m
  path: ./tenants
  prune: true
  # Never cluster-admin: may only manage tenant-* namespaces and bind ClusterRole/admin
  # (namespaced) or system:auth-delegator (see tenant-reconciler-rbac.yaml and the Kyverno
  # `restrict-tenant-reconciler` ValidatingPolicy).
  serviceAccountName: keel-tenant-reconciler
  dependsOn:
    - name: core-addons
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
