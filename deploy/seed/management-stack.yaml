# Protected Stage 0/1 Seed Management Cluster Core PKO v2 Stack (`SDD.md` §2.2, `NFR-REL-01`, `NFR-SEC-03`)
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: management-cluster-core
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/protect: "true"
    keel.io/stack-role: management-core
spec:
  serviceAccountName: keel-management-pko
  stack: management-cluster-core
  backend: s3://pulumi-state
  fluxSource:
    sourceRef:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
    dir: clusters/management
  protect: true
  destroyOnFinalize: false
  continueResyncOnCommitMatch: false
  resyncFrequencySeconds: 300
  envRefs:
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: keel-pulumi-backend
        key: passphrase
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: keel-pulumi-backend
        key: accessKeyId
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: keel-pulumi-backend
        key: secretAccessKey
  workspaceTemplate:
    spec:
      podTemplate:
        spec:
          terminationGracePeriodSeconds: 600
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
