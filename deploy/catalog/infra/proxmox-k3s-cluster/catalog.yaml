# Proxmox VE VM blueprint for a future k3s node (`SDD.md` §4.1). It clones ONE VM from a
# cloud-init template and stops there: no k3s is installed and no kubeconfig is exported, so the
# result is a VM (`resourceKind: vm`), not a cluster apps can be deployed onto. Install k3s on the
# VM yourself and attach it to Keel as a cluster.
apiVersion: keel.io/v1alpha1
kind: CatalogInfraBlueprint
metadata:
  id: proxmox-k3s-cluster
  name: Proxmox VE VM (for k3s, VM only)
  description: Clone one VM from a cloud-init template on Proxmox VE via the bpg/proxmox OpenTofu/Terraform bridge, as a node to install k3s on. Installs no Kubernetes and exports no kubeconfig.
  category: compute
  provider: proxmox
  resourceKind: vm
spec:
  pulumiRuntime: yaml
  entrypoint: Pulumi.yaml
  protectByDefault: true
  outputs:
    - clusterName
    - controlPlaneIp
  schema:
    type: object
    required:
      - clusterName
      - nodeName
      - templateVmId
      - sshPublicKey
    properties:
      clusterName:
        type: string
        title: Cluster Name (VM name prefix)
        pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      nodeName:
        type: string
        title: Proxmox Target Node
        default: pve1
      templateVmId:
        type: integer
        title: Cloud-Init Template VM ID
        default: 900
        minimum: 100
      cores:
        type: integer
        title: vCPU Cores
        default: 4
        minimum: 2
        maximum: 32
      memoryMb:
        type: integer
        title: Memory (MiB)
        default: 8192
        minimum: 2048
      sshPublicKey:
        type: string
        title: Operator SSH Public Key
  uiSchema:
    sshPublicKey:
      ui:widget: textarea
      ui:help: "ed25519 or RSA public key injected via cloud-init."
