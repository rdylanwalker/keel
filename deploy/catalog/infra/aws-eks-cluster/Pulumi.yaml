name: aws-eks-cluster
runtime: yaml
description: AWS EKS Managed Kubernetes Cluster
config:
  clusterName:
    type: string
    default: eks-workload
  region:
    type: string
    default: us-east-1
  kubernetesVersion:
    type: string
    default: "1.35"
  nodeInstanceType:
    type: string
    default: t3.medium
  desiredNodeCount:
    type: integer
    default: 2
  kubeconfigSecretName:
    type: string
    default: eks-workload-kubeconfig
  kubeconfigSecretNamespace:
    type: string
    default: tenant-default

variables:
  # Short-lived (15 min) IAM token of the identity running this deployment (the cluster creator,
  # granted cluster-admin through EKS bootstrap access). Used only by `workloadProvider`.
  eksDeployerToken:
    fn::invoke:
      function: aws:eks:getClusterAuth
      arguments:
        name: ${eksCluster.name}
      return: token
  keelFluxBearerToken:
    fn::fromBase64: ${keelFluxToken.data.token}

resources:
  eksClusterRole:
    type: aws:iam:Role
    properties:
      assumeRolePolicy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Action": "sts:AssumeRole",
              "Principal": { "Service": "eks.amazonaws.com" },
              "Effect": "Allow",
              "Sid": ""
            }
          ]
        }
      managedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  eksNodeRole:
    type: aws:iam:Role
    properties:
      assumeRolePolicy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Action": "sts:AssumeRole",
              "Principal": { "Service": "ec2.amazonaws.com" },
              "Effect": "Allow",
              "Sid": ""
            }
          ]
        }
      managedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  eksVpc:
    type: aws:ec2:Vpc
    properties:
      cidrBlock: 10.0.0.0/16
      enableDnsSupport: true
      enableDnsHostnames: true

  eksSubnet1:
    type: aws:ec2:Subnet
    properties:
      vpcId: ${eksVpc.id}
      cidrBlock: 10.0.1.0/24
      availabilityZone: ${region}a

  eksSubnet2:
    type: aws:ec2:Subnet
    properties:
      vpcId: ${eksVpc.id}
      cidrBlock: 10.0.2.0/24
      availabilityZone: ${region}b

  eksCluster:
    type: aws:eks:Cluster
    properties:
      name: ${clusterName}
      roleArn: ${eksClusterRole.arn}
      version: ${kubernetesVersion}
      accessConfig:
        authenticationMode: API_AND_CONFIG_MAP
        bootstrapClusterCreatorAdminPermissions: true
      vpcConfig:
        subnetIds:
          - ${eksSubnet1.id}
          - ${eksSubnet2.id}

  eksNodeGroup:
    type: aws:eks:NodeGroup
    properties:
      clusterName: ${eksCluster.name}
      nodeGroupName: ${clusterName}-ng
      nodeRoleArn: ${eksNodeRole.arn}
      subnetIds:
        - ${eksSubnet1.id}
        - ${eksSubnet2.id}
      scalingConfig:
        desiredSize: ${desiredNodeCount}
        maxSize: ${desiredNodeCount}
        minSize: ${desiredNodeCount}
      instanceTypes:
        - ${nodeInstanceType}

  # Kubernetes provider for the new workload cluster, authenticated with the deployer's IAM token.
  workloadProvider:
    type: pulumi:providers:kubernetes
    properties:
      kubeconfig:
        fn::secret: |
          apiVersion: v1
          kind: Config
          clusters:
          - name: workload
            cluster:
              server: ${eksCluster.endpoint}
              certificate-authority-data: ${eksCluster.certificateAuthority.data}
          contexts:
          - name: deployer
            context:
              cluster: workload
              user: deployer
          current-context: deployer
          users:
          - name: deployer
            user:
              token: ${eksDeployerToken}

  # Long-lived static credential for Flux. Flux controllers cannot run exec credential plugins
  # (no cloud CLIs in their images), so the kubeconfig Secret carries a ServiceAccount token
  # minted on the workload cluster instead of the deployer's short-lived cloud token.
  keelFluxServiceAccount:
    type: kubernetes:core/v1:ServiceAccount
    options:
      provider: ${workloadProvider}
    properties:
      metadata:
        name: keel-flux
        namespace: kube-system

  keelFluxToken:
    type: kubernetes:core/v1:Secret
    options:
      provider: ${workloadProvider}
    properties:
      metadata:
        name: keel-flux-token
        namespace: kube-system
        annotations:
          kubernetes.io/service-account.name: ${keelFluxServiceAccount.metadata.name}
      type: kubernetes.io/service-account-token

  keelFluxClusterAdmin:
    type: kubernetes:rbac.authorization.k8s.io/v1:ClusterRoleBinding
    options:
      provider: ${workloadProvider}
    properties:
      metadata:
        name: keel-flux
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: ${keelFluxServiceAccount.metadata.name}
          namespace: kube-system

  # Flux reconciles tenant HelmReleases/Kustomizations on this cluster through the kubeconfig
  # Secret while impersonating the owning tenant's ServiceAccount
  # (`system:serviceaccount:tenant-<id>:tenant-<id>-sa`, Flux multi-tenancy lockdown). The tenant
  # owns this cluster outright (it holds its admin kubeconfig), so that identity is cluster-admin.
  tenantFluxAccess:
    type: kubernetes:rbac.authorization.k8s.io/v1:ClusterRoleBinding
    options:
      provider: ${workloadProvider}
    properties:
      metadata:
        name: keel-tenant-flux
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: ${kubeconfigSecretNamespace}-sa
          namespace: ${kubeconfigSecretNamespace}

  kubeconfigSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: ${kubeconfigSecretName}
        namespace: ${kubeconfigSecretNamespace}
      stringData:
        kubeconfig:
          fn::secret: |
            apiVersion: v1
            kind: Config
            clusters:
            - name: workload
              cluster:
                server: ${eksCluster.endpoint}
                certificate-authority-data: ${eksCluster.certificateAuthority.data}
            contexts:
            - name: keel-flux
              context:
                cluster: workload
                user: keel-flux
            current-context: keel-flux
            users:
            - name: keel-flux
              user:
                token: ${keelFluxBearerToken}

outputs:
  clusterName: ${eksCluster.name}
  endpoint: ${eksCluster.endpoint}
  kubeconfig: ${kubeconfigSecret.metadata.name}
