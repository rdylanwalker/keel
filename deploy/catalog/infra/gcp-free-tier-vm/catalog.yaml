apiVersion: keel.io/v1alpha1
kind: CatalogInfraBlueprint
metadata:
  id: gcp-free-tier-vm
  name: GCP Free-Tier Compute VM
  description: Provision an Always-Free eligible GCP e2-micro virtual machine with SSH access
  category: compute
  provider: gcp
spec:
  pulumiRuntime: yaml
  entrypoint: Pulumi.yaml
  protectByDefault: true
  outputs:
    - instanceName
    - publicIp
    - sshHost
    - sshUser
    - sshPort
  schema:
    type: object
    required:
      - project
      - sshPublicKey
    properties:
      project:
        type: string
        title: GCP Project ID
      region:
        type: string
        title: GCP Region
        default: us-central1
      zone:
        type: string
        title: GCP Zone
        default: us-central1-a
      machineType:
        type: string
        title: Machine Type
        default: e2-micro
      sshUser:
        type: string
        title: SSH Username
        default: debian
      sshPublicKey:
        type: string
        title: Operator SSH Public Key
      googleCredentials:
        type: string
        title: GCP Service Account JSON Key
        writeOnly: true
        format: password
  uiSchema:
    sshPublicKey:
      ui:widget: textarea
      ui:help: "SSH public key injected into GCP instance metadata."
    googleCredentials:
      ui:widget: password
      ui:help: "Encrypted via SOPS + tenant age key before committing to Git."
