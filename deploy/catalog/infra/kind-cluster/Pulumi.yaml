# Unmodified Pulumi YAML Blueprint bridging OpenTofu/Terraform provider `tehcyx/kind` (`SDD.md` §4.1, `NFR-EXT-02`)
# Provider SDK generated via: pulumi package add terraform-provider tehcyx/kind 0.13.0
name: kind-cluster
runtime: yaml
description: Provision a local workload kind cluster via Pulumi's OpenTofu/Terraform provider bridge (tehcyx/kind)

packages:
  kind:
    source: terraform-provider
    version: 1.5.1
    parameters:
      - tehcyx/kind
      - 0.13.0

config:
  clusterName:
    type: string
    default: workload-dev
  kubernetesVersion:
    type: string
    default: v1.35.8
  workerCount:
    type: integer
    default: 1
  kubeconfigSecretName:
    type: string
    default: workload-dev-kubeconfig
  kubeconfigSecretNamespace:
    type: string
    default: tenant-default

variables:
  # Kubeconfig with the API server rewritten to the in-network `kind` control-plane address.
  inClusterKubeconfig:
    fn::secret:
      fn::join:
        - https://${clusterName}-control-plane:6443
        - fn::split:
            - ${workloadCluster.endpoint}
            - ${workloadCluster.kubeconfig}
  nodeTopologies:
    - - role: control-plane
    - - role: control-plane
      - role: worker
    - - role: control-plane
      - role: worker
      - role: worker
    - - role: control-plane
      - role: worker
      - role: worker
      - role: worker

resources:
  workloadCluster:
    type: kind:index:Cluster
    properties:
      name: ${clusterName}
      nodeImage: kindest/node:${kubernetesVersion}
      kubeconfigPath: /tmp/${clusterName}-kubeconfig
      waitForReady: false
      kindConfig:
        apiVersion: kind.x-k8s.io/v1alpha4
        kind: Cluster
        nodes:
          fn::select:
            - ${workerCount}
            - ${nodeTopologies}

  kubeconfigSecret:
    type: kubernetes:core/v1:Secret
    properties:
      metadata:
        name: ${kubeconfigSecretName}
        namespace: ${kubeconfigSecretNamespace}
      stringData:
        kubeconfig: ${inClusterKubeconfig}

  # Kubernetes provider for the new workload cluster (reachable from the PKO workspace pod via
  # the shared `kind` Docker network).
  workloadProvider:
    type: pulumi:providers:kubernetes
    properties:
      kubeconfig: ${inClusterKubeconfig}

  # Flux reconciles tenant HelmReleases/Kustomizations on this cluster through the kubeconfig
  # Secret while impersonating the owning tenant's ServiceAccount
  # (`system:serviceaccount:tenant-<id>:tenant-<id>-sa`, Flux multi-tenancy lockdown). The tenant
  # owns this cluster outright (it holds its admin kubeconfig), so that identity is cluster-admin.
  tenantFluxAccess:
    type: kubernetes:rbac.authorization.k8s.io/v1:ClusterRoleBinding
    options:
      provider: ${workloadProvider}
    properties:
      metadata:
        name: keel-tenant-flux
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: ${kubeconfigSecretNamespace}-sa
          namespace: ${kubeconfigSecretNamespace}

outputs:
  clusterName: ${workloadCluster.name}
  endpoint: ${workloadCluster.endpoint}
  kubeconfig:
    fn::secret: ${workloadCluster.kubeconfig}
