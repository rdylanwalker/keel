# Local Workload `kind` Cluster Blueprint (`SDD.md` §3.1, §4.1, `NFR-EXT-02`)
apiVersion: keel.io/v1alpha1
kind: CatalogInfraBlueprint
metadata:
  id: kind-cluster
  name: Local kind Workload Cluster
  description: Provision a local Kubernetes-in-Docker (kind) workload cluster via Pulumi's OpenTofu/Terraform bridge (tehcyx/kind).
  category: kubernetes-cluster
  provider: kind
spec:
  pulumiRuntime: yaml
  entrypoint: Pulumi.yaml
  protectByDefault: false
  outputs:
    - clusterName
    - endpoint
    - kubeconfig
  schema:
    type: object
    required:
      - clusterName
      - kubernetesVersion
      - workerCount
    properties:
      clusterName:
        type: string
        title: Cluster Name
        description: DNS-compatible name for the local kind workload cluster.
        pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        minLength: 2
        maxLength: 63
        default: workload-dev
      kubernetesVersion:
        type: string
        title: Kubernetes Version
        description: Upstream kindest/node Kubernetes image version tag.
        default: v1.35.8
        enum:
          - v1.37.0
          - v1.36.4
          - v1.35.8
          - v1.34.11
          - v1.33.12
      workerCount:
        type: integer
        title: Worker Node Count
        description: Number of worker nodes provisioned alongside the control-plane node.
        default: 1
        minimum: 0
        maximum: 3
  uiSchema:
    clusterName:
      ui:placeholder: "workload-dev"
      ui:help: "Lowercase alphanumeric DNS label (e.g., workload-dev)."
    kubernetesVersion:
      ui:help: "Select the upstream kindest/node Kubernetes version."
    workerCount:
      ui:help: "Set to 0 for a single-node control-plane cluster, or 1–3 for dedicated worker nodes."
