# Unmodified upstream default Helm values baseline for `podinfo` (`SDD.md` §3.1, `NFR-EXT-01`)
replicaCount: 2

logLevel: info

service:
  enabled: true
  type: ClusterIP
  externalPort: 9898
  internalPort: 9898

ui:
  color: "#34577c"
  message: "Deployed out-of-the-box by Keel GitOps"

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi
