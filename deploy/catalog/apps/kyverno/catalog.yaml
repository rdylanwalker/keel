# Kyverno Workload Cluster Catalog Application (`SDD.md` §5.1, `NFR-SEC-04`)
# Self-service twin of `catalog/core/kyverno` (Keel's own admission controller in `keel-system`):
# same chart and version (a drift test in `keel-cli` fails when they differ), reusing the seed
# install config of `deploy/seed/core-addons/kyverno.yaml` (CEL `policies.kyverno.io` CRDs only).
# The management-only parts (the `keel-system` PolicyException namespace and the Keel policies in
# `deploy/seed/kyverno-policies`) are not installed; tenants bring their own policies. The release
# always installs into `kyverno` (`spec.placement.namespace`), which also holds PolicyExceptions.
apiVersion: keel.io/v1alpha1
kind: CatalogApplication
metadata:
  id: kyverno
  name: Kyverno Policy Engine
  description: Kubernetes-native policy engine (CEL ValidatingPolicy, MutatingPolicy, GeneratingPolicy and image verification) for a workload cluster. Install once per cluster.
  category: security-identity
  runtime: helm
spec:
  upstream:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
    version: "3.10.0"
  # The chart installs cluster-scoped resources (Kyverno CRDs, ClusterRoles/Bindings and admission
  # webhooks), so it may only target a remote workload cluster (the management cluster runs
  # catalog/core/kyverno). Kyverno's CRDs and webhooks are cluster-wide: one install per cluster.
  # Dedicated `kyverno` namespace: a request without targetNamespace installs there and any other
  # namespace is rejected. Kyverno excludes its own namespace from its webhooks and resource
  # filters (`config.excludeKyvernoNamespace: true`), so installing it into the shared
  # `tenant-<id>` would silently exempt every other workload there from all policies.
  placement:
    scope: cluster
    namespace: kyverno
  # Same CRD lifecycle as the seed HelmRelease (Kyverno templates its CRDs, so this is parity only).
  crdPolicy: CreateReplace
  progressiveDelivery:
    flaggerSupported: false
    defaultCanary: false
  # Known-good management config (`deploy/seed/core-addons/kyverno.yaml`). Locked values make the
  # form the whole interface: values the schema does not declare are rejected.
  lockedValues:
    # Keel only uses the CEL `policies.kyverno.io/v1` policy types. Kyverno 1.20 no longer
    # executes the deprecated `kyverno.io` policy kinds, so their CRDs are not installed.
    crds:
      groups:
        kyverno:
          clusterpolicies: false
          policies: false
          policyexceptions: false
          cleanuppolicies: false
          clustercleanuppolicies: false
    # PolicyExceptions (when enabled) are only accepted from the release's own dedicated
    # namespace, which the release creates and Kyverno exempts from policies anyway. Locked (not a
    # form field), so the flag can never be empty (Kyverno then reads exceptions from every
    # namespace) nor point at a namespace any namespace creator could claim. Must equal
    # `spec.placement.namespace` (tested).
    features:
      policyExceptions:
        namespace: kyverno
  schema:
    type: object
    properties:
      admissionController:
        type: object
        title: Admission Controller
        properties:
          replicas:
            type: integer
            title: Replica Count
            description: Use 3 for high availability (the layout Kyverno documents for HA).
            default: 1
            enum:
              - 1
              - 3
              - 5
          container:
            type: object
            title: Container
            properties:
              resources:
                type: object
                title: Resources
                properties:
                  requests:
                    type: object
                    title: Requests
                    properties:
                      cpu:
                        type: string
                        title: CPU Request
                        default: 100m
                        pattern: "^[0-9]+(\\.[0-9]+)?m?$"
                      memory:
                        type: string
                        title: Memory Request
                        default: 128Mi
                        pattern: "^[0-9]+(Mi|Gi)$"
                  limits:
                    type: object
                    title: Limits
                    properties:
                      memory:
                        type: string
                        title: Memory Limit
                        default: 384Mi
                        pattern: "^[0-9]+(Mi|Gi)$"
      backgroundController:
        type: object
        title: Background Controller
        properties:
          enabled:
            type: boolean
            title: Enable Background Controller (GeneratingPolicy, mutate-existing)
            default: true
      cleanupController:
        type: object
        title: Cleanup Controller
        properties:
          enabled:
            type: boolean
            title: Enable Cleanup Controller (DeletingPolicy)
            default: true
      reportsController:
        type: object
        title: Reports Controller
        properties:
          enabled:
            type: boolean
            title: Enable Policy Reports Controller
            default: true
      features:
        type: object
        title: Features
        properties:
          policyExceptions:
            type: object
            title: Policy Exceptions
            properties:
              enabled:
                type: boolean
                title: Enable PolicyExceptions
                description: Kyverno then accepts PolicyExceptions created in its own kyverno namespace only. Anyone who can write there can exempt workloads from policies, so keep it admin-only.
                default: false
