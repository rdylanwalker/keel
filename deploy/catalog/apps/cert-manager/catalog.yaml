# cert-manager Workload Cluster Catalog Application
apiVersion: keel.io/v1alpha1
kind: CatalogApplication
metadata:
  id: cert-manager
  name: cert-manager
  description: Automated X.509 TLS certificate management (ACME, Vault, Venafi, and self-signed issuers) for Kubernetes workloads.
  category: security-identity
  runtime: helm
spec:
  upstream:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
    version: "v1.21.3"
  # The chart installs cluster-scoped resources (6 CRDs, ClusterRoles/Bindings and admission webhooks), so
  # it may only target a remote workload cluster (the management cluster runs catalog/core/cert-manager).
  placement:
    scope: cluster
  progressiveDelivery:
    flaggerSupported: false
    defaultCanary: false
  schema:
    type: object
    properties:
      replicaCount:
        type: integer
        title: Controller Replicas
        default: 1
        minimum: 1
        maximum: 5
      crds:
        type: object
        title: CRD Management
        properties:
          enabled:
            type: boolean
            title: Install CRDs
            default: true
