# Flagger Catalog Application (`SDD.md` §5.1, §5.2, `NFR-REL-03`)
apiVersion: keel.io/v1alpha1
kind: CatalogApplication
metadata:
  id: flagger
  name: Flagger Progressive Delivery
  description: Automated canary promotion and rollback controller integrating with Envoy Gateway (Gateway API v1) and Prometheus.
  category: progressive-delivery
  runtime: helm
spec:
  upstream:
    chart: flagger
    repoURL: https://flagger.app
    version: "1.40.0"
  # The chart installs cluster-scoped resources (Canary/MetricTemplate/AlertProvider CRDs and a ClusterRole/Binding), so
  # it may only target a remote workload cluster (the management cluster runs catalog/core/flagger).
  placement:
    scope: cluster
  progressiveDelivery:
    flaggerSupported: false
    defaultCanary: false
  schema:
    type: object
    required:
      - meshProvider
      - metricsServer
    properties:
      meshProvider:
        type: string
        title: Mesh / Gateway Provider
        description: Traffic routing provider used by Flagger for canary weight shifting.
        default: gatewayapi:v1
        enum:
          - gatewayapi:v1
          - kubernetes
          - istio
          - nginx
      metricsServer:
        type: string
        title: Prometheus Metrics Server URL
        description: In-cluster Prometheus URL queried by Flagger for canary metric checks.
        default: http://prometheus.keel-system:80
      podMonitor:
        type: object
        title: PodMonitor
        properties:
          enabled:
            type: boolean
            title: Enable PodMonitor CRD
            default: false
