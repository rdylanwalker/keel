# Rauthy OIDC Identity Provider Core Addon Catalog Application
# Image-based plain-manifest (kustomize) add-on reconciled by the Flux Kustomization
# `flux-system/rauthy` (`clusters/management/core-addons/rauthy.yaml`). `upstream.version` is the
# `ghcr.io/sebadob/rauthy` image tag (`spec.images[].newTag`). Upgrades are version-only: Rauthy
# runs a single Hiqlite node whose raft membership is configuration-driven, so replica scaling is
# intentionally not offered.
apiVersion: keel.io/v1alpha1
kind: CatalogApplication
metadata:
  id: rauthy
  name: Rauthy OIDC Provider
  description: Lightweight Rust OpenID Connect identity provider with Admin UI for users, groups, and OIDC clients.
  category: management-core
  runtime: kustomize
spec:
  upstream:
    image: ghcr.io/sebadob/rauthy
    version: "0.37.2"
  progressiveDelivery:
    flaggerSupported: false
    defaultCanary: false
  serviceUrl: https://idp.keel.local:8888/auth/v1/admin
  schema:
    type: object
    properties: {}
    additionalProperties: false
