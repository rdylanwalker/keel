# Pulumi Kubernetes Operator Core Addon Catalog Application
apiVersion: keel.io/v1alpha1
kind: CatalogApplication
metadata:
  id: pulumi-kubernetes-operator
  name: Pulumi Kubernetes Operator
  description: Infrastructure-as-Code operator executing Pulumi Stacks for cloud infrastructure provisioning and ephemeral preview environments.
  category: management-core
  runtime: helm
spec:
  upstream:
    chart: oci://ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
    repoURL: oci://ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
    # renovate: datasource=docker depName=ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
    version: "2.10.1"
  progressiveDelivery:
    flaggerSupported: false
    defaultCanary: false
  # Only keys the management API accepts for this add-on (`management_addon_mutable_values`):
  # the upgrade dialog submits every schema default, so a default on a locked key (security
  # contexts, CA trust volumes/env) would reject every GUI upgrade. `replicaCount` is the key the
  # 2.x chart reads; its default matches the seed `core-addons/pko.yaml`.
  schema:
    type: object
    properties:
      replicaCount:
        type: integer
        title: Operator Replicas
        default: 1
        minimum: 1
        maximum: 10
      controller:
        type: object
        title: Operator Controller Settings
        properties:
          logLevel:
            type: string
            title: Log Level
            enum:
              - debug
              - info
              - error
