# Envoy Gateway Core Addon Catalog Application
apiVersion: keel.io/v1alpha1
kind: CatalogApplication
metadata:
  id: envoy-gateway
  name: Envoy Gateway Controller
  description: Next-generation Kubernetes Gateway API controller for managing cluster traffic, ingress routing, and progressive canary rollouts.
  category: management-core
  runtime: helm
spec:
  upstream:
    chart: oci://docker.io/envoyproxy/gateway-helm
    repoURL: oci://docker.io/envoyproxy/gateway-helm
    version: "v1.10.0"
  progressiveDelivery:
    flaggerSupported: false
    defaultCanary: false
  schema:
    type: object
    properties:
      deployment:
        type: object
        title: Controller Deployment
        properties:
          replicas:
            type: integer
            title: Replicas
            default: 1
            minimum: 1
            maximum: 5
      config:
        type: object
        title: Envoy Gateway Configuration
        properties:
          envoyGateway:
            type: object
            title: Gateway Settings
            properties:
              logging:
                type: object
                properties:
                  level:
                    type: object
                    properties:
                      default:
                        type: string
                        title: Log Level
                        default: info
                        enum:
                          - debug
                          - info
                          - warn
                          - error
