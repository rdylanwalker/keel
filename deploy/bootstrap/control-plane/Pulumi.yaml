# Stage 0 Seed Control-Plane Addons (`SDD.md` §2.1, §6.2, `NFR-SEC-03`)
# Provisions seed namespaces, SOPS age secret, Flux CD, Kyverno, PKO v2, SeaweedFS S3,
# Envoy Gateway, Prometheus, and Flagger via pulumi-kubernetes.
#
# Anti-lockout (AGENTS.md guardrail 7, NFR-REL-01): core control-plane resources (namespaces,
# SOPS age key, Flux, Kyverno, PKO, S3 state backend) carry `protect: true`. Keel never runs
# `pulumi destroy` on this stack; tearing it down requires an explicit
# `pulumi state unprotect --all` first (or deleting the whole cluster).
#
# Flux handoff: every Helm release that has a seed Flux HelmRelease
# (`deploy/seed/core-addons/*.yaml`, same release name/namespace/version/values) is adopted by
# Flux in place after Stage 0. Those releases ignore every chart-affecting input (`chart`,
# `version`, `values`, `repositoryOpts`, `timeout`, `waitForJobs`, `createNamespace`) so a later
# Pulumi run (e.g. `keel bootstrap recover`) never runs a `helm upgrade` with the stale Stage 0
# inputs and reverts an upgrade or rollback applied by Flux through a Git PR. Do not add or edit
# other inputs of an adopted release after handoff (any non-ignored input diff triggers such an
# upgrade); change the seed HelmRelease in Git instead (`SDD.md` §2.1).
name: keel-stage0-control-plane
runtime: yaml
description: Stage 0 seed control-plane addons (Flux CD, Kyverno, PKO v2, SeaweedFS, Envoy Gateway, Prometheus, Flagger)

config:
  kubeconfig:
    type: string
  kubeContext:
    type: string
    default: ""
  sopsAgeKey:
    type: string
    default: ""
  enableKyvernoPolicyExceptions:
    type: boolean
    default: true

resources:
  k8sProvider:
    type: pulumi:providers:kubernetes
    properties:
      kubeconfig: ${kubeconfig}
      context: ${kubeContext}
      enableServerSideApply: true

  fluxSystemNamespace:
    type: kubernetes:core/v1:Namespace
    options:
      protect: true
      provider: ${k8sProvider}
    properties:
      metadata:
        name: flux-system
        labels:
          app.kubernetes.io/managed-by: keel
          app.kubernetes.io/part-of: keel-control-plane

  keelSystemNamespace:
    type: kubernetes:core/v1:Namespace
    options:
      protect: true
      provider: ${k8sProvider}
    properties:
      metadata:
        name: keel-system
        labels:
          app.kubernetes.io/managed-by: keel
          app.kubernetes.io/part-of: keel-control-plane
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

  keelPreviewsNamespace:
    type: kubernetes:core/v1:Namespace
    options:
      provider: ${k8sProvider}
    properties:
      metadata:
        name: keel-previews
        labels:
          app.kubernetes.io/managed-by: keel
          app.kubernetes.io/part-of: keel-control-plane
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

  sopsAgeSecret:
    type: kubernetes:core/v1:Secret
    options:
      protect: true
      provider: ${k8sProvider}
      dependsOn:
        - ${fluxSystemNamespace}
    properties:
      metadata:
        name: sops-age
        namespace: flux-system
        labels:
          app.kubernetes.io/managed-by: keel
          keel.io/secret-kind: sops-age
      type: Opaque
      stringData:
        age.agekey: ${sopsAgeKey}

  # Flux adopts this release in place through the seed `flux2` HelmRelease
  # (`deploy/seed/core-addons/flux2.yaml`: same release name, namespace, version and values) and
  # from then on upgrades / rolls back itself from Git. Keep them in lockstep.
  flux2:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      protect: true
      provider: ${k8sProvider}
      dependsOn:
        - ${fluxSystemNamespace}
    properties:
      name: flux2
      chart: oci://ghcr.io/fluxcd-community/charts/flux2
      # Pinned: latest stable flux2 community chart (Flux v2.x controllers) at time of pinning,
      # confirmed via `helm show chart oci://ghcr.io/fluxcd-community/charts/flux2`. Renovate bumps it.
      # renovate: datasource=docker depName=ghcr.io/fluxcd-community/charts/flux2
      version: "2.20.0"
      namespace: flux-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        # Multi-tenancy lockdown (NFR-SEC-02): adds `--no-cross-namespace-refs=true` and
        # `--default-service-account=default` to kustomize/helm controllers, so any Flux
        # Kustomization/HelmRelease without `spec.serviceAccountName` impersonates the
        # permissionless `default` SA of its own namespace. Platform Kustomizations in
        # `flux-system` explicitly impersonate `kustomize-controller`, the core add-on
        # HelmReleases in `flux-system` impersonate `helm-controller` (installing into
        # `keel-system` via `targetNamespace`/`storageNamespace`); tenant Kustomizations
        # impersonate `tenant-<id>-sa`; the root tenants Kustomization impersonates
        # `keel-tenant-reconciler` (confined by Kyverno `restrict-tenant-reconciler`).
        multitenancy:
          enabled: true
          defaultServiceAccount: default
          # Controllers keep cluster-admin so they can impersonate the SAs above.
          privileged: true
        # Flux CRDs survive a `helm uninstall` of this release, so every Flux object (and the
        # workloads it manages) outlives an accidental uninstall and is re-adopted on reinstall.
        crds:
          annotations:
            helm.sh/resource-policy: keep

  # Single Kyverno install in `keel-system`, release `kyverno`, pinned to a chart whose bundled
  # CRDs serve `policies.kyverno.io/v1` (ValidatingPolicy / GeneratingPolicy / PolicyException,
  # verified with `helm pull kyverno/kyverno --version 3.10.0`). The Flux HelmRelease in
  # `deploy/seed/core-addons/kyverno.yaml` uses the same release name, namespace, version and
  # values so Flux adopts this release in place (no second install). Keep them in lockstep.
  kyverno:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      protect: true
      provider: ${k8sProvider}
      dependsOn:
        - ${keelSystemNamespace}
    properties:
      name: kyverno
      chart: kyverno
      # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
      version: "3.10.0"
      repositoryOpts:
        repo: https://kyverno.github.io/kyverno/
      namespace: keel-system
      createNamespace: false
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        # Keel only uses the CEL `policies.kyverno.io/v1` policy types. Kyverno 1.20 no longer
        # executes the deprecated `kyverno.io` policy kinds, and installing their CRDs only makes
        # the controllers emit deprecation warnings, so they are not installed.
        crds:
          groups:
            kyverno:
              clusterpolicies: false
              policies: false
              policyexceptions: false
              cleanuppolicies: false
              clustercleanuppolicies: false
        admissionController:
          replicas: 1
        features:
          policyExceptions:
            enabled: ${enableKyvernoPolicyExceptions}
            namespace: keel-system

  pulumiKubernetesOperator:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      protect: true
      provider: ${k8sProvider}
      dependsOn:
        - ${keelSystemNamespace}
    properties:
      name: pulumi-kubernetes-operator
      chart: oci://ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
      # Pinned; must match deploy/seed/core-addons/pko.yaml (Flux adopts this release).
      # renovate: datasource=docker depName=ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
      version: "2.10.1"
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        replicaCount: 1
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        # Pinned (chart default today): the aggregated `edit`/`admin` ClusterRoles grant tenant admins
        # (`tenant-<id>-sa`, used by tenant Flux Kustomizations) their Stacks and Programs. Kyverno
        # `restrict-tenant-pulumi-objects` denies tenants the operator-owned parts they also cover
        # (`auto.pulumi.com` Workspaces/Updates, `stacks/status`, the `keel.io/protect` label).
        rbac:
          createClusterAggregationRoles: true
        # Trust the public Keel CA (`keel-system/keel-ca-bundle`, `ca.crt` only) in addition to the
        # system roots: the controller resolves tenant/preview Stack branches (go-git ls-remote)
        # against the in-cluster Forgejo HTTPS ingress (`forge.publicUrl`). `optional`, so the
        # operator also starts before the bundle exists or without a local CA.
        # SSH host keys for the same branch tracking over SSH (GitHub tenant repositories, go-git
        # reads `SSH_KNOWN_HOSTS`): keel-server / `keel bootstrap init` write the public host keys of
        # the platform forge to `keel-system/keel-pko-ssh-known-hosts` when tenants use SSH. Also
        # `optional` (anti-lockout): without it HTTPS sources are unaffected and SSH ones fail closed.
        extraEnv:
          - name: SSL_CERT_DIR
            value: /etc/ssl/certs:/etc/keel-ca
          - name: SSH_KNOWN_HOSTS
            value: /etc/keel-ssh/known_hosts
        extraVolumes:
          - name: keel-ca
            configMap:
              name: keel-ca-bundle
              optional: true
          - name: keel-ssh-known-hosts
            configMap:
              name: keel-pko-ssh-known-hosts
              optional: true
              items:
                - key: known_hosts
                  path: known_hosts
        extraVolumeMounts:
          - name: keel-ca
            mountPath: /etc/keel-ca
            readOnly: true
          - name: keel-ssh-known-hosts
            mountPath: /etc/keel-ssh
            readOnly: true

  s3StateBackend:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      protect: true
      provider: ${k8sProvider}
      dependsOn:
        - ${keelSystemNamespace}
    properties:
      name: s3-state-backend
      chart: seaweedfs
      # renovate: datasource=helm depName=seaweedfs registryUrl=https://seaweedfs.github.io/seaweedfs/helm
      version: "4.54.0"
      repositoryOpts:
        repo: https://seaweedfs.github.io/seaweedfs/helm
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        s3:
          enabled: true
          enableAuth: true
          logs:
            type: emptyDir
        master:
          logs:
            type: emptyDir
          data:
            type: persistentVolumeClaim
            size: 1Gi
        filer:
          logs:
            type: emptyDir
          data:
            type: persistentVolumeClaim
            size: 2Gi
        volume:
          logs:
            type: emptyDir
          idx:
            type: persistentVolumeClaim
            size: 2Gi
          dataDirs:
            - name: data1
              type: persistentVolumeClaim
              size: 10Gi
              maxVolumes: 0

  envoyGateway:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      provider: ${k8sProvider}
      dependsOn:
        - ${keelSystemNamespace}
    properties:
      name: envoy-gateway
      chart: oci://docker.io/envoyproxy/gateway-helm
      # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-helm
      version: "v1.10.0"
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600

  prometheus:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      provider: ${k8sProvider}
      dependsOn:
        - ${keelSystemNamespace}
    properties:
      name: prometheus
      chart: prometheus
      # renovate: datasource=helm depName=prometheus registryUrl=https://prometheus-community.github.io/helm-charts
      version: "29.48.0"
      repositoryOpts:
        repo: https://prometheus-community.github.io/helm-charts
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: true
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          fullnameOverride: prometheus
          retention: 7d
          persistentVolume:
            enabled: false

  flagger:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      provider: ${k8sProvider}
      dependsOn:
        - ${envoyGateway}
        - ${prometheus}
    properties:
      name: flagger
      chart: flagger
      # renovate: datasource=helm depName=flagger registryUrl=https://flagger.app
      version: "1.45.0"
      repositoryOpts:
        repo: https://flagger.app
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        meshProvider: gatewayapi:v1
        metricsServer: http://prometheus.keel-system.svc.cluster.local:80
        podMonitor:
          enabled: false

  certManager:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Flux owns the release after the in-place handoff (seed HelmRelease); re-runs
      # (`keel bootstrap recover`) must not revert Flux-applied upgrades, so every
      # chart-affecting input is ignored (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      provider: ${k8sProvider}
      dependsOn:
        - ${keelSystemNamespace}
    properties:
      name: cert-manager
      chart: cert-manager
      # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
      version: "v1.21.3"
      repositoryOpts:
        repo: https://charts.jetstack.io
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        crds:
          enabled: true
