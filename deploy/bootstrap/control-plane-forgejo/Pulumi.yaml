# Stage 0 In-Cluster Forgejo Git Forge (`SDD.md` §2.1)
# Installed when `keel bootstrap init --with-forge` is enabled.
#
# Flux handoff: the seed `forgejo` HelmRelease (`deploy/seed/core-addons/forgejo.yaml`, written to
# Git only with `--with-forge`) adopts this release in place: same release name, namespace, chart
# version and values (`forgejo_helmrelease_adopts_stage0_release_in_place`). Keep them in
# lockstep. After the handoff every chart-affecting input is ignored, so a later Pulumi run (e.g.
# `keel bootstrap recover`) never runs a `helm upgrade` with stale Stage 0 inputs and reverts an
# upgrade or rollback applied by Flux through a Git PR. Do not add or edit other inputs of the
# release after handoff; change the seed HelmRelease in Git instead (`SDD.md` §2.1).
name: keel-stage0-control-plane-forgejo
runtime: yaml
description: Stage 0 in-cluster Forgejo Git forge in keel-system

config:
  kubeconfig:
    type: string
  kubeContext:
    type: string
    default: ""
  # Public Forgejo URL rendered by `keel bootstrap init` from `--oidc-public-url`
  # (`https://forgejo.<domain>[:port]/`). The default only applies to stacks created before this
  # setting existed (their release ignores `values` after the Flux handoff anyway).
  forgejoRootUrl:
    type: string
    default: "https://forgejo.keel.local:8888/"

resources:
  k8sProvider:
    type: pulumi:providers:kubernetes
    properties:
      kubeconfig: ${kubeconfig}
      context: ${kubeContext}
      enableServerSideApply: true

  forgejo:
    type: kubernetes:helm.sh/v3:Release
    options:
      # Hosts the GitOps repository Flux reconciles from (anti-lockout, `NFR-REL-01`).
      protect: true
      # Flux owns the release after the in-place handoff (see the header note).
      ignoreChanges:
        - chart
        - version
        - values
        - repositoryOpts
        - timeout
        - waitForJobs
        - createNamespace
      provider: ${k8sProvider}
    properties:
      name: forgejo
      chart: oci://code.forgejo.org/forgejo-helm/forgejo
      # Pinned (latest stable at time of pinning via `helm show chart`); Renovate bumps it.
      # renovate: datasource=docker depName=code.forgejo.org/forgejo-helm/forgejo
      version: "17.3.3"
      namespace: keel-system
      createNamespace: true
      waitForJobs: true
      # First image pulls on a fresh cluster are slow (k3s VM targets still pull one at a time).
      timeout: 600
      values:
        gitea:
          admin:
            # Credentials are generated per cluster by `keel bootstrap init` (or taken from
            # KEEL_FORGEJO_ADMIN_PASSWORD) and stored in this Secret before the chart installs;
            # no password ever appears in Helm or Pulumi values.
            existingSecret: keel-forgejo-admin
            email: admin@keel.local
          config:
            server:
              ROOT_URL: ${forgejoRootUrl}
            database:
              DB_TYPE: sqlite3
            # Forgejo hardening (`SDD.md` §6.2).
            repository:
              # Tenant users get read access to their own repository; a fork would outlive their
              # removal from it, so forking is off instance-wide.
              DISABLE_FORKS: true
            service:
              # No local sign-up (accounts come from the OIDC IdP or the admin API), so nobody can
              # register Keel's service-account names first.
              ALLOW_ONLY_EXTERNAL_REGISTRATION: true
              # Only site admins create organisations, so nobody can squat `keel-tenants`.
              DEFAULT_ALLOW_CREATE_ORGANIZATION: false
            oauth2_client:
              ENABLE_AUTO_REGISTRATION: true
              ACCOUNT_LINKING: auto
              USERNAME: userid
              OPENID_CONNECT_SCOPES: openid email profile groups
        persistence:
          enabled: false
        valkey-cluster:
          enabled: false
        valkey:
          enabled: false
        postgresql:
          enabled: false
        postgresql-ha:
          enabled: false
        extraVolumes:
          - name: keel-ca
            secret:
              secretName: keel-wildcard-tls
              items:
                - key: ca.crt
                  path: ca.crt
        extraVolumeMounts:
          - name: keel-ca
            mountPath: /etc/ssl/keel-ca
            readOnly: true
        deployment:
          env:
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/ssl/keel-ca
