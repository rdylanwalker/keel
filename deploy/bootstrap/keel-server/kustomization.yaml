# In-cluster `keel serve` (OPEN-26, `SDD.md` §6.3): least-privilege RBAC + restricted Deployment.
#
# Two ways to run it:
# - Flux-managed (recommended): `keel bootstrap init --with-keel-server` writes `rbac.yaml` and
#   `deployment.yaml` to `clusters/management/addons/keel-server/` with a rendered
#   `keel-server-config` and an ingress HTTPRoute, reconciled by the protected
#   `flux-system/keel-server` Flux Kustomization (`catalog/core/keel-server`).
# - Manual: `kubectl apply -k deploy/bootstrap/keel-server` after Stage 0.
#
# Neither ships a `tenant-<id>` object: the `tenant-<id>/keel-server` RoleBinding is part of each
# tenant baseline (`tenants/<id>/rbac.yaml`, created by Stage 0 and owned by the `keel-tenants`
# Flux Kustomization) and is `keel.io/platform-owned`, so re-applying it from here would be denied
# by Kyverno `protect-platform-owned-tenant-objects` for managed-cluster admins.
#
# The `ghcr.io/rdylanwalker/keel` image is pinned to the release matching this checkout (the
# workspace crate version, bumped by semantic-release together with `deployment.yaml`); never
# `latest`. Pin another release or mirror with
# `kustomize edit set image ghcr.io/rdylanwalker/keel=<registry>/keel:<version>`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - deployment.yaml
# Server configuration consumed via `envFrom` (hash-suffixed, so edits roll the Deployment).
# Point `KEEL_GIT_URL` at an external forge with a kustomize overlay, e.g.
#   configMapGenerator: [{name: keel-server-config, behavior: merge,
#                         literals: [KEEL_GIT_URL=https://github.com/acme/infra.git]}]
configMapGenerator:
  - name: keel-server-config
    namespace: keel-system
    options:
      labels:
        app.kubernetes.io/name: keel-server
        app.kubernetes.io/managed-by: keel
    literals:
      - KEEL_GIT_URL=http://forgejo-http.keel-system.svc.cluster.local:3000/keel/infra-gitops.git
      - KEEL_GIT_USERNAME=keel
images:
  - name: ghcr.io/rdylanwalker/keel
    newTag: "0.12.1"
