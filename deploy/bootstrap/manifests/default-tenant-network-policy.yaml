apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pko-workspace
  namespace: tenant-default
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/tenant: default
    keel.io/platform-owned: "true"
spec:
  podSelector:
    matchLabels:
      auto.pulumi.com/component: workspace
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keel-system
    ports:
    - protocol: TCP
      port: 50051
  egress:
  - {}
