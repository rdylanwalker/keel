apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keel-tenants
  namespace: flux-system
spec:
  interval: 1m
  path: ./tenants
  prune: true
  serviceAccountName: keel-tenant-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
