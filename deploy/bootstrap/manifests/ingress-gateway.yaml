# Envoy GatewayClass, `keel-ingress` Gateway (HTTP 80, HTTPS 8888 local / 443) and the Rauthy route.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: keel-envoy
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keel-ingress
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  gatewayClassName: keel-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-local
      protocol: HTTPS
      port: 8888
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: keel-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: keel-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rauthy-ingress
  namespace: keel-system
  labels:
    app.kubernetes.io/managed-by: keel
spec:
  parentRefs:
    - name: keel-ingress
      namespace: keel-system
      sectionName: https-local
    - name: keel-ingress
      namespace: keel-system
      sectionName: https
  hostnames:
    - ${IDP_HOST}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rauthy
          port: 8080
