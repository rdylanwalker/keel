# Local-dev only (`--local-dev-docker-socket-exception` on `kind`): socat proxy exposing the
# host Docker socket to PKO workspace pods for nested kind provisioning.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-docker-proxy
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/local-dev-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keel-docker-proxy
  template:
    metadata:
      labels:
        app: keel-docker-proxy
    spec:
      containers:
        - name: socat
          image: alpine/socat:latest
          args:
            - -t
            - "600"
            - TCP-LISTEN:2375,fork,reuseaddr
            - UNIX-CONNECT:/var/run/docker.sock
          ports:
            - containerPort: 2375
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: keel-docker-proxy
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/local-dev-only: "true"
spec:
  selector:
    app: keel-docker-proxy
  ports:
    - port: 2375
      targetPort: 2375
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keel-docker-proxy
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: keel
    keel.io/local-dev-only: "true"
spec:
  podSelector:
    matchLabels:
      app: keel-docker-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              auto.pulumi.com/component: workspace
      ports:
        - port: 2375
          protocol: TCP
