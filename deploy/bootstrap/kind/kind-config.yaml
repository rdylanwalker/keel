# Stage 0 Local Workstation Bootstrap Cluster (`SDD.md` §2.1)
# Invoked via: keel bootstrap init --target kind --kind-config deploy/bootstrap/kind/kind-config.yaml
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: keel-mgmt
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
      keel.io/cluster-role: management
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Envoy Gateway HTTP ingress
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Envoy Gateway HTTPS ingress
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Keel Stage 0/1 setup portal & stateless API
      - containerPort: 8080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
