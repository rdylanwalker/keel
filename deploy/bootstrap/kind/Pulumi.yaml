# Stage 0 Local Workstation Management Cluster Bootstrap (`SDD.md` §2.1)
# Provisions a protected kind management control-plane cluster via tehcyx/kind OpenTofu/Terraform bridge.
name: keel-stage0-kind
runtime: yaml
description: Stage 0 seed management cluster bootstrap on local workstation (tehcyx/kind)

packages:
  kind:
    source: terraform-provider
    version: 1.5.1
    parameters:
      - tehcyx/kind
      - 0.13.0

config:
  clusterName:
    type: string
    default: keel-mgmt
  kubernetesVersion:
    type: string
    default: v1.35.0
  dockerSocketMountIndex:
    type: integer
    default: 0

variables:
  dockerSocketMountVariants:
    - []
    - - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock

resources:
  mgmtCluster:
    type: kind:index:Cluster
    options:
      protect: true
    properties:
      name: ${clusterName}
      nodeImage: kindest/node:${kubernetesVersion}
      kindConfig:
        apiVersion: kind.x-k8s.io/v1alpha4
        kind: Cluster
        nodes:
          - role: control-plane
            labels:
              ingress-ready: "true"
              keel.io/cluster-role: management
            kubeadmConfigPatches:
              - |
                kind: InitConfiguration
                nodeRegistration:
                  kubeletExtraArgs:
                    node-labels: "ingress-ready=true"
            extraPortMappings:
              - containerPort: 80
                hostPort: 80
                listenAddress: "127.0.0.1"
                protocol: TCP
              - containerPort: 443
                hostPort: 443
                listenAddress: "127.0.0.1"
                protocol: TCP
            extraMounts:
              fn::select:
                - ${dockerSocketMountIndex}
                - ${dockerSocketMountVariants}

outputs:
  clusterName: ${mgmtCluster.name}
  endpoint: ${mgmtCluster.endpoint}
  kubeconfig:
    fn::secret: ${mgmtCluster.kubeconfig}
