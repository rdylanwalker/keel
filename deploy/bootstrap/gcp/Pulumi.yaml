# Stage 0 GCP Seed Management Cluster & Versioned GCS State Bucket (`SDD.md` §2.1, `NFR-REL-01`)
name: keel-stage0-gcp
runtime: yaml
description: Stage 0 GCP seed management cluster with versioned GCS state backend

config:
  clusterName:
    type: string
    default: keel-mgmt
  region:
    type: string
    default: us-central1
  zone:
    type: string
    default: us-central1-a
  stateBucketName:
    type: string
  machineType:
    type: string
    default: e2-micro
  bootDiskSizeGb:
    type: integer
    default: 10
  bootDiskType:
    type: string
    default: pd-standard
  sshUser:
    type: string
    default: debian
  protectResources:
    type: boolean
    default: true

resources:
  pulumiStateBucket:
    type: gcp:storage:Bucket
    options:
      protect: true
    properties:
      name: ${stateBucketName}
      location: ${region}
      uniformBucketLevelAccess: true
      publicAccessPrevention: enforced
      versioning:
        enabled: true
      labels:
        managed-by: keel
        keel-protect: "true"

  seedControlPlaneVm:
    type: gcp:compute:Instance
    options:
      protect: true
    properties:
      name: ${clusterName}-cp-01
      machineType: ${machineType}
      zone: ${zone}
      deletionProtection: ${protectResources}
      bootDisk:
        initializeParams:
          image: debian-cloud/debian-12
          size: ${bootDiskSizeGb}
          type: ${bootDiskType}
      networkInterfaces:
        - network: default
      labels:
        managed-by: keel
        keel-protect: "true"

outputs:
  clusterName: ${clusterName}
  stateBucketUrl: ${pulumiStateBucket.url}
  controlPlaneInternalIp: ${seedControlPlaneVm.networkInterfaces[0].networkIp}
  sshHost: ${seedControlPlaneVm.networkInterfaces[0].networkIp}
  sshUser: ${sshUser}
  sshPort: 22
