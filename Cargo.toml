[workspace]
resolver = "2"
members = [
    "crates/keel-core",
    "crates/keel-git",
    "crates/keel-pko",
    "crates/keel-kube",
    "crates/keel-server",
    "crates/keel-cli",
]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Workspace members
keel-core = { path = "crates/keel-core" }
keel-git = { path = "crates/keel-git" }
keel-pko = { path = "crates/keel-pko" }
keel-kube = { path = "crates/keel-kube" }
keel-server = { path = "crates/keel-server" }

# External dependencies
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
noyalib = { version = "0.0.63", default-features = false, features = ["std", "lossless-u64"] }
kube = { version = "5.0", default-features = false, features = ["runtime", "client", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
jsonschema = "0.61"
fancy-regex = "0.20"
rust-embed = "8.5"
aes-gcm = "0.11"
sha2 = "0.11"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
tower-http = { version = "0.7", features = ["trace"] }
futures = "0.3"
http = "1"
base64 = "0.23"
hex = "0.4"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
url = "2.5"
russh = "0.65"
zeroize = "1.9"
hmac = "0.13"
